server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    # index.html and appsettings.json keep their names when they change, so browsers must revalidate.
    add_header Cache-Control "no-cache";

    # Framework files have fixed names. A missing one should fail with 404, not return index.html.
    location /_framework/ {
        try_files $uri =404;
    }

    # Client-side routes such as /api-status are rendered by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
